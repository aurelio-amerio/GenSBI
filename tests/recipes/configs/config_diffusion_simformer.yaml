strategy:
  method: "diffusion"
  model: "simformer"

optimizer:
  max_lr: 1.0e-3
  min_lr: 1.0e-8

model:
  in_channels: 2
  val_emb_dim: 40
  id_emb_dim: 40
  cond_emb_dim: 10
  fourier_features: 256
  num_heads: 2
  num_layers: 2
  widening_factor: 3
  qkv_features: 10
  num_hidden_layers: 1

training:
  batch_size: 4096
  nsteps: 50000
  ema_decay: 0.990
  multistep: 1
  early_stopping: true
  val_every: 100
  experiment_id: 1
  restore_model: true
  train_model: false
