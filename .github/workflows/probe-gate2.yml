name: probe-gate2

on:
  pull_request:
    branches: ["main"]

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jax0120-pdm-r1
            jax: "0.12.0.1"
            xla_flags: "--xla_cpu_enable_platform_dependent_math=false"
          - name: jax0120-pdm-r2
            jax: "0.12.0.1"
            xla_flags: "--xla_cpu_enable_platform_dependent_math=false"
          - name: jax0120-pdm-r3
            jax: "0.12.0.1"
            xla_flags: "--xla_cpu_enable_platform_dependent_math=false"
          - name: jax0120-pdm-r4
            jax: "0.12.0.1"
            xla_flags: "--xla_cpu_enable_platform_dependent_math=false"
          - name: jax0120-pdm-r5
            jax: "0.12.0.1"
            xla_flags: "--xla_cpu_enable_platform_dependent_math=false"
          - name: jax0120-avx2cap-r1
            jax: "0.12.0.1"
            xla_flags: "--xla_cpu_max_isa=AVX2"
          - name: jax0120-avx2cap-r2
            jax: "0.12.0.1"
            xla_flags: "--xla_cpu_max_isa=AVX2"
          - name: jax0120-avx2cap-r3
            jax: "0.12.0.1"
            xla_flags: "--xla_cpu_max_isa=AVX2"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: |
          uv sync --group test
          uv pip install "jax==${{ matrix.jax }}" "jaxlib==${{ matrix.jax }}"
          uv pip check
      - name: CPU info
        run: |
          lscpu | grep -E "Model name"
          echo "avx512: $(grep -o 'avx512[a-z_0-9]*' /proc/cpuinfo | sort -u | tr '\n' ' ')"
      - name: Environment
        run: uv run --no-sync python -c "import jax; jax.print_environment_info()"
      - name: Gate-2 ratio (seed 2, every 500 steps to 4000)
        env:
          XLA_FLAGS: ${{ matrix.xla_flags }}
        run: uv run --no-sync python ci_probe_gate2.py 2
