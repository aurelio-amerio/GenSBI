[project]
name = "gensbi"
version = "0.3.5"
description = "GenSBI is a library for Simulation-Based Inference using generative methods in JAX."
authors = [{ name = "Aurelio Amerio", email = "dev@gensbi.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "jax>=0.9.0, <0.11.0",
    "matplotlib>=3.10",
    "numpy>=2.3.5",
    "flax>=0.12.4",
    "diffrax>=0.7.0",
    "equinox>=0.13.1",
    "numpyro>=0.20.0",
    "tqdm>=4.62.0",
    "corner>=2.2.3",
    "seaborn>=0.13.2",
    "orbax-checkpoint>=0.11.32",
    "optax>=0.2.6",
    "einops>=0.8.1",
    "grain>=0.2.15",
    "scipy>=1.17.0",
    "scikit-learn>=1.8.0",
    "KDEpy>=1.1.12"
]

[project.urls]
Homepage = "https://github.com/aurelio-amerio/GenSBI"
Issues = "https://github.com/aurelio-amerio/GenSBI/issues"

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.9.0"] 
cuda13 = ["jax[cuda13]>=0.9.0"] 
tpu = ["jax[tpu]>=0.9.0"] 

examples = ["gensbi-examples"]

[dependency-groups]
lint = [
    "flake8",
]
test = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "pytest-mock",
    "pytest-env",
    "genbadge[all]",
    "junitparser",
]
docs = [
    "jupytext",
    "pandoc",
    "pydata-sphinx-theme",
    "sphinx",
    "myst-nb",
    "astroid>=3,<5", # fix for sphinx.autoapi and read the docs, should be reverted at a later date - see issue #2125
    "numpydoc",
    "linkify-it-py", # for link shortening
    "sphinxext-rediraffe",
    # TODO: unpin sphinx-sitemap once a solution is offered for https://github.com/jdillard/sphinx-sitemap/issues/109
    "sphinx-sitemap<2.7.0",
    "sphinx-autoapi>=3.0.0",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-togglebutton",
    "sphinxcontrib-mermaid",
    "sphinx-favicon>=1.0.1",
]

notebooks = [
    "notebook>=7.5.4",
]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "docs"},
    {include-group = "notebooks"},
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-n 2"
env = [
    "JAX_PLATFORMS=cpu"
]
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "experimental: marks tests as experimental",
]
