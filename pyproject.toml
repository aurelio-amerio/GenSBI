[project]
name = "gensbi"
version = "0.4.1"
description = "GenSBI is a library for Simulation-Based Inference using generative methods in JAX."
authors = [{ name = "Aurelio Amerio", email = "dev@gensbi.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "jax>=0.10.2, <0.12.0",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "flax>=0.12.7",
    "diffrax>=0.7.2",
    "equinox>=0.13.8",
    "numpyro>=0.21.0",
    "tqdm>=4.68.3",
    "corner>=2.2.3",
    "seaborn>=0.13.2",
    "orbax-checkpoint>=0.12.1",
    "optax>=0.2.8",
    "einops>=0.8.2",
    "grain>=0.2.18",
    "scipy>=1.18.0",
    "scikit-learn>=1.9.0",
    "KDEpy>=1.1.12",
    "blackjax>=1.6",
    "safetensors[jax]>=0.8.0",
    "healpy>=1.19.0",
]

[project.urls]
Homepage = "https://github.com/aurelio-amerio/GenSBI"
Issues = "https://github.com/aurelio-amerio/GenSBI/issues"

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.10.2, <0.12.0", "nvidia-cudnn-cu12<9.11.0"] 
cuda13 = ["jax[cuda13]>=0.10.2, <0.12.0"] 
tpu = ["jax[tpu]>=0.10.2, <0.12.0"] 

examples = ["sbibm-jax[loader]"]

[dependency-groups]
lint = [
    "flake8",
]
test = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "pytest-mock",
    "pytest-env",
    "genbadge[all]",
    "junitparser",
]
docs = [
    "jupytext",
    "pandoc",
    "pydata-sphinx-theme",
    "sphinx",
    "myst-nb",
    "astroid>=4.1.2,<5", # fix for sphinx.autoapi and read the docs, should be reverted at a later date - see issue #2125
    "numpydoc",
    "linkify-it-py", # for link shortening
    "sphinxext-rediraffe",
    # TODO: unpin sphinx-sitemap once a solution is offered for https://github.com/jdillard/sphinx-sitemap/issues/109
    "sphinx-sitemap<2.7.0",
    "sphinx-autoapi>=3.8.0",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-togglebutton",
    "sphinxcontrib-mermaid",
    "sphinx-favicon>=1.1.0",
]

notebooks = [
    "notebook>=7.6.0",
]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "docs"},
    {include-group = "notebooks"},
]


[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-n 2"
env = [
    "JAX_PLATFORMS=cpu"
]
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "extraslow: marks tests as extra slow / end-to-end (deselect with '-m \"not extraslow\"'); excluded from CI",
    "experimental: marks tests as experimental",
]
